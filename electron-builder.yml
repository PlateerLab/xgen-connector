appId: com.plateerlab.xgen.connector
# ⚠ **공백을 넣지 말 것.** 리눅스는 /opt/<productName> 에 설치되는데, 경로에
# 공백이 있으면 Chromium zygote 가 자기 자신을 재실행할 때 그 지점에서 잘려
# 죽는다 (실기 확인):
#     LaunchProcess: failed to execvp: /opt/XGEN
#     FATAL:zygote_host_impl_linux.cc(201) Check failed
# 사용자에게 보이는 이름은 .desktop 의 Name 이 따로 담당한다.
productName: XGEN-Connector
directories:
  buildResources: build
  output: release
# Explicit publish provider so electron-builder can resolve update-info even
# with GH_TOKEN present. Actual upload is done by the release workflow via
# action-gh-release; the packaging step runs with `--publish never`.
publish:
  provider: github
  owner: PlateerLab
  repo: xgen-connector
# Ad-hoc sign the macOS .app so Apple Silicon doesn't hard-block the
# un-notarized build as "손상됨 — 휴지통으로 이동". No-op once a Developer ID
# (CSC_LINK / CSC_IDENTITY) is configured.
afterPack: build/afterPack.cjs
files:
  - out/**
  - package.json
# 에이전트 로컬 실행 런타임 — **앱에 내장**한다. scripts/bundle-python-sidecar.mjs
# 가 prepackage 로 resources/python-sidecar/(이식형 CPython + xgen-agent-runtime,
# 사이드카 포함)를 조립하고, 여기서 앱 resources/python 으로 복사한다.
# resolveSidecarCommand 의 packaged 경로(<resources>/python/bin/python3 |
# python\python.exe)와 정렬. 커넥터는 그 자체로 로컬 실행 환경을 갖춘다 —
# 설정의 설치 버튼은 이후 업데이트/복구(userData 오버라이드)용이다.
extraResources:
  - from: resources/python-sidecar
    to: python
    filter: ['**/*']
# Native .node addons (keytar) must be unpacked from the asar or they fail to
# load at runtime ("cannot find module .node").
asarUnpack:
  - '**/*.node'
  - '**/node_modules/keytar/**'
  # FUSE 바인딩(가상 드라이브, Linux) — .node 는 asar 안에서 dlopen 이 안 된다.
  - '**/node_modules/@cocalc/**'
  # ws + the MCP SDK spawn stdio subprocesses / load from disk — unpack so they
  # resolve outside the asar at runtime.
  - '**/node_modules/ws/**'
  - '**/node_modules/@modelcontextprotocol/**'
  # Pinned Apache-2.0 native browser automation helper. Executables cannot run
  # from inside app.asar; the npm package carries verified OS/arch binaries.
  - '**/node_modules/agent-browser/bin/**'
  - '**/node_modules/agent-browser/LICENSE'
# Hyphenated, space-free artifact names. productName has a space ("XGEN
# Connector"), and electron-updater 404s when the built file, latest*.yml and
# the GitHub asset disagree on how spaces are encoded — a literal hyphenated
# name is identical everywhere.
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: PlateerLab <noreply@plateerlab.dev>
  synopsis: XGEN desktop connector - log in, browse your agents, chat
  artifactName: XGEN-Connector-${version}.${ext}
  # 창 ↔ .desktop 매칭 (GNOME 독 아이콘 중복/무명 창 방지). Electron 의
  # WM_CLASS 는 package.json name("xgen-connector")에서 온다.
  # ⚠ electron-builder 24 는 desktop 키를 FLAT 맵으로 받는다 (v26 의
  # desktop.entry 중첩형을 쓰면 조용히 무시되어 기본 productName 이 들어간다
  # — 실빌드 dpkg-deb 검증으로 확인).
  desktop:
    StartupWMClass: xgen-connector
    # 설치 경로는 공백이 없어야 하지만(위 참조) 런처에 보이는 이름은 예쁘게.
    Name: XGEN Connector
deb:
  # 커스텀 postinst: chrome-sandbox 를 **무조건** SUID-root 로 만든다. 기본
  # 템플릿의 `unshare --user` 프로브는 root 로 돌아 항상 성공하지만, Ubuntu
  # 23.10+/24.04 는 apparmor_restrict_unprivileged_userns=1 로 실제 사용자의
  # userns 를 막는다 → 헬퍼가 0755 로 남아 앱이 SIGTRAP 으로 죽는다.
  afterInstall: build/linux-after-install.tpl
  # ⚠ 기본 depends 를 재기술하면 통째로 **대체**되므로 전체 목록을 명시한다.
  # electron-builder 의 기본값에는 GNOME2/Unity 시대 패키지(gconf2,
  # gconf-service, libappindicator1)가 남아 있는데, **Ubuntu 22.04+ 에서
  # 제거되어 존재하지 않는다** → 설치가 "의존성 해결 불가"로 실패한다
  # (앱 센터에서는 이유 없이 실패한 것처럼 보인다). 실제로 후보가 있는
  # 패키지만 남긴다.
  #
  # t64 전환(24.04)으로 이름이 바뀐 것들은 **양쪽을 대안으로** 적는다 —
  # 한쪽만 적으면 그 배포판에서 설치가 막힌다.
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libsecret-1-0
    - libxss1
    - xdg-utils
    - libgtk-3-0 | libgtk-3-0t64
    - libatspi2.0-0 | libatspi2.0-0t64
    - libayatana-appindicator3-1 | libappindicator3-1
    # XGEN 워크스페이스(가상 드라이브). 근거는 추측이 아니라 바이너리다:
    #   ldd fuse.node → libfuse.so.2   (애드온이 libfuse2 를 동적 링크)
    #   /usr/bin/fusermount → setuid root  (비루트 마운트에 필수)
    # Ubuntu 24.04 에서 libfuse2 는 libfuse2t64 로 개명됐다 — 둘 다 받는다.
    - libfuse2 | libfuse2t64
    - fuse3 | fuse
win:
  target:
    - nsis
  artifactName: XGEN-Connector-Setup-${version}.${ext}
nsis:
  # 통합 데이터 폴더 선택 페이지(build/installer.nsh)를 보이려면 assisted 설치가
  # 필요하다 — one-click 은 커스텀 페이지를 건너뛴다.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # NSIS auto-selects installer UI language by OS locale among these.
  installerLanguages:
    - en_US
    - ko_KR
  unicode: true
  # 설치 시 WebDAV 파일 크기 상한 해제 + WebClient 자동 시작 (관리자 단계).
  # 기본 50MiB 상한에 걸리면 탐색기가 조용히 거부해 "파일이 안 열린다"로만
  # 보인다 — 설치 때 한 번 올려 두는 것이 유일하게 깨끗한 지점이다.
  include: build/installer.nsh
mac:
  target:
    - dmg
  category: public.app-category.productivity
  artifactName: XGEN-Connector-${version}.${ext}
